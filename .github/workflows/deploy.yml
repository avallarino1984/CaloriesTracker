# Builds, tests and deploys the Blazor PWA to Azure Static Web Apps (free plan).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Fail the deployment if the calorie math or the MEAL parser breaks.
      - name: Test
        run: dotnet test tests/CaloriesTracker.Core.Tests

      - name: Publish
        run: dotnet publish src/CaloriesTracker.Web -c Release -o publish

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
          skip_api_build: true
